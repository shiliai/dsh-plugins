# Portable DeepSeek Harness settings for dsh-bootstrap — FULL baseline.
#
# This is the portable source template. When it contains credential-backed base
# URLs, dsh-bootstrap renders a marked machine-local $DSH_HOME/settings.yaml and
# safely refreshes that generated file on later runs.
#
# IMPORTANT — no secrets or private endpoints live here. Every provider references
# its API key with `apiKeyEnv` and its endpoint with `baseURL: credential:NAME`.
# dsh-bootstrap stores both values in $DSH_HOME/.credentials.yaml and renders a
# machine-local settings.yaml for DSH. The credentials file must NEVER be committed.
#
# Keep this in sync with whatever machine you curate on: when you add a custom
# model (contextWindow, `input: [text, image]` for multimodal, `reasoningEfforts`
# for thinking effort), commit the change here and `git pull` elsewhere.

ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
llm-pi-ai:
  providers:
    kimi:
      apiKeyEnv: KIMI_API_KEY
      api: anthropic-messages
      baseURL: credential:KIMI_BASE_URL
      reasoning: high
      models:
        - id: k3-256k
          input: [ text, image ]
          name: k3-256k
          contextWindow: 262144
          reasoningEfforts:
            off:
            high: high
        - id: k3
          input: [ text, image ]
          name: k3
          contextWindow: 1000000
          reasoningEfforts:
            off:
            high: high
    glm:
      apiKeyEnv: GLM_API_KEY
      api: anthropic-messages
      baseURL: credential:GLM_BASE_URL
      reasoning: high
      models:
        - id: glm-5.3
          contextWindow: 1000000
          reasoningEfforts:
            off:
            low: low
            high: high
            max: max
        - id: glm-5.3-flash
          name: glm-5.3-flash
          input: [ text, image ]
          contextWindow: 1000000
          maxTokens: 128000
    gpt:
      apiKeyEnv: GPT_API_KEY
      api: openai-responses
      baseURL: credential:GPT_BASE_URL
      reasoning: high
      models:
        - id: gpt-5.6-luna
          input: [ text, image ]
          name: gpt-5.6-luna
          reasoningEfforts:
            off:
            minimal: minimal
            low: low
            medium: medium
            high: high
            xhigh: xhigh
        - id: gpt-5.6-sol
          input: [ text, image ]
          name: gpt-5.6-sol
          reasoningEfforts:
            off:
            minimal: minimal
            low: low
            medium: medium
            high: high
            xhigh: xhigh
        - id: gpt-5.6-terra
          input: [ text, image ]
          name: gpt-5.6-terra
          reasoningEfforts:
            off:
            minimal: minimal
            low: low
            medium: medium
            high: high
            xhigh: xhigh
    ds-haitian:
      apiKeyEnv: DS_HAITIAN_API_KEY
      api: openai-completions
      baseURL: credential:DS_HAITIAN_BASE_URL
      compat:
        thinkingFormat: openai
        supportsReasoningEffort: true
      reasoning: high
      models:
        - id: deepseek-v4-flash-0731
          contextWindow: 1000000
          reasoningEfforts:
            off: null
            high: high
            max: max
        - id: deepseek-v4-flash
          maxTokens: 393216
        - id: qwen3.8-27b
          name: qwen3.8-27b-3090
          input: [ text, image ]
          contextWindow: 144384
          reasoningEfforts:
            off:
            low: low
    minimax-relay:
      apiKeyEnv: MINIMAX_RELAY_API_KEY
      api: anthropic-messages
      baseURL: credential:MINIMAX_RELAY_BASE_URL
      models:
        - id: MiniMax-M3
          input: [ text, image ]
          name: M3
          contextWindow: 1000000
ui-theme:
  preference: light
locale:
  preference: zh
agent-default-model:
  provider: ds-haitian
  model: deepseek-v4-flash-0731
  reasoningEffort: high
