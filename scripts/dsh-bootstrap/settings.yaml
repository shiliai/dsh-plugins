# Portable DeepSeek Harness settings for dsh-bootstrap — FULL baseline.
#
# This file is symlinked into $DSH_HOME/settings.yaml on every machine. Edit it
# here (single source of truth), then `git pull` on the other machines to sync —
# the symlink picks up the change automatically.
#
# IMPORTANT — no secrets live here. Every provider references its key by env name
# (`apiKeyEnv`); the actual secrets go into $DSH_HOME/.credentials.yaml, which
# dsh-bootstrap creates per machine and which must NEVER be committed.
#
# Keep this in sync with whatever machine you curate on: when you add a custom
# model (contextWindow, `input: [text, image]` for multimodal, `reasoningEfforts`
# for thinking effort), commit the change here and `git pull` elsewhere.

ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
llm-pi-ai:
  providers:
    gb10-cluster:
      apiKeyEnv: GB10_CLUSTER_API_KEY
      api: openai-completions
      baseURL: https://your-llm-gateway.example.com/v1
      compat:
        thinkingFormat: openai
        supportsReasoningEffort: true
      reasoning: high
      models:
        - id: deepseek-v4-flash-0731
          contextWindow: 1000000
          reasoningEfforts:
            off: null
            high: high
            max: max
        - id: qwen3.8-27b
          name: qwen3.8-27b-4090
          contextWindow: 262144
          input:
            - text
            - image
          reasoningEfforts:
            off: null
            low: low
    kimi:
      apiKeyEnv: KIMI_API_KEY
      api: anthropic-messages
      baseURL: https://your-llm-gateway.example.com/v1
      reasoning: high
      models:
