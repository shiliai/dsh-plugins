# dsh-wecom: credentials and allowlists are intentionally configured by users.
- insert:
    - id: dsh-wecom
      name: '@dsh-plugins/dsh-wecom'
      inject: [tools, agents, agentDefaultModel, agentPresets, sessions, webServer]
      config:
        botId: !!js process.env.WECOM_BOT_ID ?? ''
        botSecret: !!js process.env.WECOM_BOT_SECRET ?? ''
        # Empty allowlists deny access. See README for explicit identities.
        allowChats: []
        allowGroupSenders: []
        outboundAllowChats: []
        # Authorization watchdog. Monitors the WeCom long connection and data
        # permission, and alerts when authorization becomes unavailable instead
        # of failing silently. alertChatId/webhookUrl are the destinations
        # (log-only when unset). See README "授权监控" section.
        authWatchdog:
          enabled: true
          checkIntervalMs: 60000
          minDowntimeMs: 120000
          alertCooldownMs: 3600000
          alertChatId: ''
          webhookUrl: ''
