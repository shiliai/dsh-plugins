# dsh-wecom — WeCom smart-robot long-connection bridge
# Resident WebSocket bot on a DSH agent session (conversation memory).
- insert:
    - id: dsh-wecom
      name: '@dsh-plugins/dsh-wecom'
      inject: [tools, agents, agentDefaultModel, sessions]
      config:
        botId: !!js process.env.WECOM_BOT_ID ?? ''
        botSecret: !!js process.env.WECOM_BOT_SECRET ?? ''
        # Optional: filter which chats may talk to the bot (comma-separated
        # userid offsets are not matched; use sender display names/keywords).
        allowChats: []   # empty = allow all
        denyListReply: true
