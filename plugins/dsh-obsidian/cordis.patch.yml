- insert:
    - id: dsh-obsidian
      name: '@dsh-plugins/dsh-obsidian'
      inject: [webServer, tools, skills]
      config:
        vaultRoot: !!js process.cwd()
        # Optional explicit origin allowlist for mutations. When unset, any
        # Origin matching the request's own Host header is accepted, so GUI
        # port/host changes need no configuration.
        mutationOrigin: !!js process.env.DSH_OBSIDIAN_ORIGIN
        maxNoteBytes: 2097152
        searchResultLimit: 100
